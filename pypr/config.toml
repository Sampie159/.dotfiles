[pyprland]
plugins = ["scratchpads", "magnify"]

[magnify]
factor = 2

# alacritty, not ghostty: ghostty's single-instance activation breaks pypr's class matching
[scratchpads.term]
animation = "fromTop"
command = "alacritty --class=term-scratch"
class = "term-scratch"
lazy = true
size = "75% 60%"
position = "12% 4%"
unfocus = "hide"

[scratchpads.btop]
animation = "fromTop"
command = "alacritty --class=btop-scratch -e btop"
class = "btop-scratch"
lazy = true
size = "80% 80%"
position = "10% 10%"

[scratchpads.irssi]
animation = "fromTop"
command = "alacritty --class=irssi-scratch -e irssi"
class = "irssi-scratch"
lazy = true
size = "80% 80%"
position = "10% 10%"
