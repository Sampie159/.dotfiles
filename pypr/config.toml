[pyprland]
plugins = [
    "scratchpads",
    "magnify",
]

# SUPER + Equal / Minus  ->  pypr zoom
[magnify]
factor = 2

# alacritty scratchpads: --class sets the wayland app_id pyprland matches
# on. Not ghostty - its GTK single-instance activation collapses a new
# launch into an already-running ghostty window instead of spawning a
# fresh one, breaking class matching and pypr's process tracking.

[scratchpads.term]
animation = "fromTop"
command = "alacritty --class=term-scratch"
class = "term-scratch"
size = "75% 60%"
position = "12% 4%"
lazy = true
unfocus = "hide"

[scratchpads.btop]
animation = "fromTop"
command = "alacritty --class=btop-scratch -e btop"
class = "btop-scratch"
size = "80% 80%"
position = "10% 10%"
lazy = true

[scratchpads.irssi]
animation = "fromTop"
command = "alacritty --class=irssi-scratch -e irssi"
class = "irssi-scratch"
size = "80% 80%"
position = "10% 10%"
lazy = true

# rofi's spawned pid exits before pypr's wait-for-client match fires, and
# pypr's process_tracking path bails out the instant the pid dies without
# even trying a class match on that last check - reports "is it already
# running?" on the very first launch. process_tracking=false routes
# through the pid-agnostic path instead, which keeps retrying the class
# match regardless of whether the spawned pid is still alive.
[scratchpads.rofi]
animation = "fromTop"
command = "rofi -show drun"
class = "rofi"
match_by = "class"
process_tracking = false
size = "40% 50%"
position = "30% 8%"
lazy = true
unfocus = "hide"
close_on_hide = true
