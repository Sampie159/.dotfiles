[pyprland]
plugins = ["scratchpads", "magnify"]

[magnify]
factor = 2

[scratchpads.term]
animation = "fromTop"
command = "kitty --class=term-scratch"
class = "term-scratch"
lazy = true
size = "75% 60%"
position = "12% 4%"
unfocus = "hide"

[scratchpads.btop]
animation = "fromTop"
command = "kitty --class=btop-scratch btop"
class = "btop-scratch"
lazy = true
size = "80% 80%"
position = "10% 10%"

[scratchpads.irssi]
animation = "fromTop"
command = "kitty --class=irssi-scratch irssi"
class = "irssi-scratch"
lazy = true
size = "80% 80%"
position = "10% 10%"
